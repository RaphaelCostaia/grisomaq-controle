server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Os arquivos com hash no nome nunca mudam de conteúdo: cachear por um ano é
  # o que faz o app abrir instantâneo na segunda vez, mesmo em 3G.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O service worker NUNCA pode ser cacheado. Se ele for, o celular fica preso
  # numa versão antiga do app e nenhuma atualização chega — inclusive a que
  # corrigiria um bug de sincronização.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index. Sem isto, abrir /abastecimento direto
  # (que é como o operador volta ao app pelo atalho) devolveria 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # O Traefik do EasyPanel já cuida do HTTPS e do HSTS; aqui ficam apenas os
  # cabeçalhos que dependem do conteúdo servido.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
}

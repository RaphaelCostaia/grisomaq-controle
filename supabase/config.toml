project_id = "grisomaq-controle"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://localhost:5180"]

# Uma hora de access token; o refresh cuida do resto.
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Janela de reuso generosa DE PROPOSITO: em sinal instavel, duas requisicoes
# sobem juntas e a segunda chega com o token ja rotacionado. Com reuso curto,
# isso invalidaria a sessao do funcionario no meio do turno.
refresh_token_reuse_interval = 30

enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sessions]
# Sem time-box e sem timeout de inatividade: o celular do campo pode passar
# dias sem sinal, e a sessao precisa sobreviver a isso. O controle de acesso
# no aparelho e o bloqueio de tela por PIN, que e local.

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/fn_token_customizado"

[edge_runtime]
enabled = true

[functions.login-campo]
verify_jwt = false

[functions.trocar-pin]
verify_jwt = true

[functions.provisionar-funcionario]
verify_jwt = true

[functions.verificar-assinaturas]
verify_jwt = true
